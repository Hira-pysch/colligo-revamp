<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Collgo - Forgot Password</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>

<body class="auth-body">

    <header class="auth-header">
        <div class="container">
            <a href="index.html" class="logo">
                <div class="logo-circle"></div>
                COLLIGO
            </a>
            <nav class="auth-nav">
                <a href="#"><i class="fas fa-cog"></i></a>
                <a href="index.html"><i class="fas fa-home"></i></a>
            </nav>
        </div>
    </header>

    <main class="auth-page">
        <div class="auth-container">
            <h2 class="welcome-text">Forgot Your Password?</h2>
            <p class="auth-subtext">Enter your email to reset it</p>

            <form class="forgot-password-form">
                
                <div class="input-group">
                    <i class="fas fa-envelope"></i>
                    <input type="email" id="reset-email" placeholder="Email" required>
                </div>

                <button type="submit" class="auth-button">Send Reset Email</button>

                <p class="auth-link-text">
                    Remember your password? <a href="login.html" class="auth-link">Log in</a>
                </p>
            </form>
        </div>
    </main>
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        
        
        const firebaseConfig = {
            apiKey: "AIzaSyDByxtekgi1CRBs0FWpSstrIWMlDbv1CHA",
            authDomain: "responsive-app-df28f.firebaseapp.com",
            projectId: "responsive-app-df28f",
            storageBucket: "responsive-app-df28f.firebasestorage.app",
            messagingSenderId: "242703032257",
            appId: "1:242703032257:web:cf20ab70b92fa3609e5940",
            measurementId: "G-MK0XLZ808S"
        };
        
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        
        
        window.auth = auth;
      
        window.sendPasswordResetEmail = sendPasswordResetEmail;
    </script>
    <script>
        document.querySelector('.forgot-password-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('reset-email').value;
            
            try {
                await sendPasswordResetEmail(window.auth, email);
                console.log('Password reset email sent');
                alert('Password reset email sent! Check your inbox.');
                
            } catch (error) {
                console.error('Reset error:', error.message);
                alert('Failed to send reset email: ' + error.message);
            }
        });
    </script>
    
</body>
</html>
