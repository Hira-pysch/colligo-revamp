<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Collgo - Reset Password</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>

<body class="auth-body">

    <header class="auth-header">
        <div class="container">
            <a href="index.html" class="logo">
                <div class="logo-circle"></div>
                COLLIGO
            </a>
            <nav class="auth-nav">
                <a href="#"><i class="fas fa-cog"></i></a>
                <a href="index.html"><i class="fas fa-home"></i></a>
            </nav>
        </div>
    </header>

    <main class="auth-page">
        <div class="auth-container">
            <h2 class="welcome-text">Reset Your Password</h2>
            <p class="auth-subtext">Enter a new password</p>

            <form class="reset-password-form">
                
                <div class="input-group">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="new-password" placeholder="New Password" required>
                    <i class="fas fa-eye password-toggle"></i>
                </div>

                <div class="input-group">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="confirm-new-password" placeholder="Confirm New Password" required>
                    <i class="fas fa-eye password-toggle"></i>
                </div>

                <button type="submit" class="auth-button">Reset Password</button>

                <p class="auth-link-text">
                    Remember your password? <a href="login.html" class="auth-link">Log in</a>
                </p>
            </form>
        </div>
    </main>
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, confirmPasswordReset } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        
    
        const firebaseConfig = {
            apiKey: "AIzaSyDByxtekgi1CRBs0FWpSstrIWMlDbv1CHA",
            authDomain: "responsive-app-df28f.firebaseapp.com",
            projectId: "responsive-app-df28f",
            storageBucket: "responsive-app-df28f.firebasestorage.app",
            messagingSenderId: "242703032257",
            appId: "1:242703032257:web:cf20ab70b92fa3609e5940",
            measurementId: "G-MK0XLZ808S"
        };
        
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        
        window.auth = auth;

        window.confirmPasswordReset = confirmPasswordReset; 
    </script>
    <script>
        document.querySelector('.reset-password-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const newPassword = document.getElementById('new-password').value;
            const confirmPassword = document.getElementById('confirm-new-password').value;
            
            if (newPassword !== confirmPassword) {
                alert('Passwords do not match');
                return;
            }
            
            const urlParams = new URLSearchParams(window.location.search);
            const actionCode = urlParams.get('oobCode');
            
            if (!actionCode) {
                alert('Invalid reset link. Please request a new one.');
                return;
            }
            
            try {
   
                await confirmPasswordReset(window.auth, actionCode, newPassword); 
                console.log('Password reset successful');
                alert('Password reset successful! You can now log in.');
                window.location.href = 'login.html';
            } catch (error) {
                console.error('Reset error:', error.message);
                alert('Failed to reset password: ' + error.message);
            }
        });
    </script>
    
</body>
</html>
