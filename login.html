<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Collgo - Log In</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>

<body class="auth-body">

    <header class="auth-header">
        <div class="container">
            <a href="index.html" class="logo">
                <div class="logo-circle"></div>
                COLLIGO
            </a>
            <nav class="auth-nav">
                <a href="#"><i class="fas fa-cog"></i></a>
                <a href="index.html"><i class="fas fa-home"></i></a>
            </nav>
        </div>
    </header>

    <main class="auth-page">
        <div class="auth-container">
            <h2 class="welcome-text">Welcome Back!</h2>
            <p class="auth-subtext">Log in</p>

            <form class="login-form">
                
                <div class="input-group">
                    <i class="fas fa-envelope"></i>
                    <input type="email" id="email" placeholder="Email" required>
                </div>

                <div class="input-group">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="password" placeholder="Password" required>
                    <i class="fas fa-eye password-toggle"></i>
                </div>

                <div class="form-options">
                    <label class="remember-me">
                        <input type="checkbox" id="remember-me">
                        Remember Me
                    </label>
                    <a href="forgot_password.html" class="forgot-password">Forgot Password?</a>
                </div>

                <button type="submit" class="auth-button">Log In</button>

                <p class="auth-link-text">
                    Don't have an account? <a href="signup.html" class="auth-link">Sign Up</a>
                </p>
            </form>
        </div>
    </main>
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        
       
        const firebaseConfig = {
            apiKey: "AIzaSyDByxtekgi1CRBs0FWpSstrIWMlDbv1CHA",
            authDomain: "responsive-app-df28f.firebaseapp.com",
            projectId: "responsive-app-df28f",
            storageBucket: "responsive-app-df28f.firebasestorage.app",
            messagingSenderId: "242703032257",
            appId: "1:242703032257:web:cf20ab70b92fa3609e5940",
            measurementId: "G-MK0XLZ808S"
        };
        
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        
       
        document.querySelector('.login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            try {
                const userCredential = await signInWithEmailAndPassword(auth, email, password);
                const user = userCredential.user;
                
               
                console.log('Login successful:', user);
                window.location.href = 'dashboard.html'; 
                
            } catch (error) {
                console.error('Login error:', error.message);
                
                let errorMessage = 'Login failed: Invalid email or password.';
                if (error.code === 'auth/user-not-found' || error.code === 'auth/wrong-password' || error.code === 'auth/invalid-credential') {
                    errorMessage = 'Login failed: Invalid email or password.';
                }
                
                alert(errorMessage); 
            }
        });
    </script>
    <script>
        
        document.querySelectorAll('.password-toggle').forEach(toggle => {
            toggle.addEventListener('click', function() {
                const passwordInput = this.previousElementSibling;
                if (passwordInput.type === 'password') {
                    passwordInput.type = 'text';
                    this.classList.replace('fa-eye', 'fa-eye-slash');
                } else {
                    passwordInput.type = 'password';
                    this.classList.replace('fa-eye-slash', 'fa-eye');
                }
            });
        });
    </script>

</body>
</html>
