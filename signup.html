<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Collgo - Create Account</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>

<body class="auth-body">

    <header class="auth-header">
        <div class="container">
            <a href="index.html" class="logo">
                <div class="logo-circle"></div>
                COLLIGO
            </a>
            <nav class="auth-nav">
                <a href="#"><i class="fas fa-cog"></i></a>
                <a href="index.html"><i class="fas fa-home"></i></a>
            </nav>
        </div>
    </header>

    <main class="auth-page">
        <div class="auth-container signup-form-container">
            <h2 class="welcome-text create-account-title">Create Account</h2>

            <form class="signup-form">
                
                <div class="form-row">
                    <div class="input-col">
                        <label for="full-name">Full Name</label>
                        <div class="input-group">
                            <input type="text" id="full-name" placeholder="Full Name" required>
                        </div>
                    </div>
                    <div class="input-col">
                        <label for="email-address">Email Address</label>
                        <div class="input-group">
                            <input type="email" id="email-address" placeholder="Email" required>
                        </div>
                    </div>
                </div>

                <div class="form-row">
                    <div class="input-col">
                        <label for="signup-password">Password</label>
                        <div class="input-group">
                            <input type="password" id="signup-password" placeholder="Password" required>
                            <i class="fas fa-eye password-toggle"></i>
                        </div>
                    </div>
                    <div class="input-col">
                        <label for="confirm-password">Confirm Password</label>
                        <div class="input-group">
                            <input type="password" id="confirm-password" placeholder="Password" required>
                            <i class="fas fa-eye password-toggle"></i>
                        </div>
                    </div>
                </div>

                <button type="submit" class="auth-button create-button">Create Account</button>

                <p class="auth-link-text">
                    or <a href="login.html" class="auth-link">Log in</a>
                </p>
            </form>
        </div>
    </main>
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, setDoc, doc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        
        const firebaseConfig = {
            apiKey: "AIzaSyDByxtekgi1CRBs0FWpSstrIWMlDbv1CHA",
            authDomain: "responsive-app-df28f.firebaseapp.com",
            projectId: "responsive-app-df28f",
            storageBucket: "responsive-app-df28f.firebasestorage.app",
            messagingSenderId: "242703032257",
            appId: "1:242703032257:web:cf20ab70b92fa3609e5940",
            measurementId: "G-MK0XLZ808S"
        };
        
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        
        document.querySelector('.signup-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const fullName = document.getElementById('full-name').value;
            const email = document.getElementById('email-address').value;
            const password = document.getElementById('signup-password').value;
            const confirmPassword = document.getElementById('confirm-password').value;
            
            if (password !== confirmPassword) {
                alert('Passwords do not match');
                return;
            }
            
            const defaultOrgType = 'School';
            
            try {
                const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                const userId = userCredential.user.uid;

                await setDoc(doc(db, 'users', userId), {
                    fullName: fullName,
                    email: email,
                    role: 'Super Admin', 
                    organizationType: defaultOrgType, 
                    organizationId: userId, 
                    createdAt: new Date()
                });

                await setDoc(doc(db, 'organizations', userId), {
                    name: `${fullName}'s ${defaultOrgType} Account`,
                    type: defaultOrgType,
                    ownerId: userId,
                    memberCount: 1,
                    createdAt: new Date()
                });
                
                console.log('Signup successful. Super Admin created.');
                window.location.href = 'dashboard.html'; 
            } catch (error) {
                console.error('Signup error:', error.message);
                alert('Signup failed: ' + error.message);
            }
        });
    </script>
    <script>
        document.querySelectorAll('.password-toggle').forEach(toggle => {
            toggle.addEventListener('click', function() {
                const passwordInput = this.previousElementSibling;
                if (passwordInput.type === 'password') {
                    passwordInput.type = 'text';
                    this.classList.replace('fa-eye', 'fa-eye-slash');
                } else {
                    passwordInput.type = 'password';
                    this.classList.replace('fa-eye-slash', 'fa-eye');
                }
            });
        });
    </script>
</body>
</html>
