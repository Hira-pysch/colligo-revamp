<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Collgo - Edit Member</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="dashboard.css"> 
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    
</head>

<body class="auth-body">

    <header class="auth-header">
        <div class="container">
            <a href="index.html" class="logo">
                <div class="logo-circle"></div>
                COLLIGO
            </a>
            <div class="auth-nav">
                <span class="user-profile-icon"><i class="fas fa-user-circle"></i></span>
                <span id="user-short-name" class="user-short-name">Admin</span>
            </div>
        </div>
    </header>

    <main class="dashboard-grid">
        <nav class="sidebar">
            <ul class="sidebar-menu">
                <li class="menu-item"><a href="dashboard.html"><i class="fas fa-th-large"></i> Dashboard</a></li>
                <li class="menu-item active"><a href="members.html"><i class="fas fa-users"></i> Members</a></li>
                <li class="menu-item"><a href="#"><i class="fas fa-calendar-alt"></i> Attendance</a></li>
                <li class="menu-item"><a href="#"><i class="fas fa-stream"></i> Activities</a></li>
                <li class="menu-item"><a href="#"><i class="fas fa-cog"></i> Settings</a></li>
                <li class="menu-item logout-item">
                    <a href="#" id="logout-button"><i class="fas fa-sign-out-alt"></i> Log Out</a>
                </li>
            </ul>
        </nav>

        <section class="main-content">
            <div class="content-header">
                <h1 id="page-title">Edit Member Profile</h1>
                <p>Modify the details and role of the selected organization member.</p>
            </div>

            <div class="add-member-form-container">
                <form class="edit-member-form">
                    
                    <div class="form-fields">
                        <input type="hidden" id="member-doc-id">
                        
                        <div class="form-group">
                            <label for="member-full-name">Full Name</label>
                            <input type="text" id="member-full-name" required>
                        </div>

                        <div class="form-group">
                            <label for="member-email">Email Address</label>
                            <input type="email" id="member-email" required readonly style="opacity: 0.7;"> 
                        </div>

                        <div class="form-group">
                            <label for="member-org-id">Organization ID (Group)</label>
                            <input type="text" id="member-org-id" required readonly style="opacity: 0.7;"> 
                        </div>

                        <div class="form-group">
                            <label for="member-role">Access Role</label>
                            <select id="member-role" required>
                                <option value="member">Member</option>
                                <option value="admin">Admin</option>
                                <option value="super-admin">Super Admin</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="member-status">Status</label>
                            <select id="member-status" required>
                                <option value="active">Active</option>
                                <option value="pending">Pending</option>
                                <option value="inactive">Inactive</option>
                            </select>
                        </div>
                    </div>

                    <div class="qr-section">
                        <h3>Member Access Tools</h3>
                        
                        <div id="qrcode"></div>
                        <p class="member-id-display" style="font-weight: 600; color: var(--accent-green);"></p>
                        <p>This is the member's unique QR code used for attendance.</p>
                        
                        <div class="qr-actions-group">
                            <button type="button" id="download-qr-button" class="download-qr-button" disabled>
                                <i class="fas fa-download"></i> Download QR Code
                            </button>

                            <button type="button" id="reset-password-button" class="reset-password-button">
                                <i class="fas fa-lock"></i> Send Password Reset Link
                            </button>
                        </div>
                    </div>
                    
                    <div class="form-actions">
                        <a href="members.html" class="back-button">
                            <i class="fas fa-arrow-left"></i> Cancel
                        </a>
                        <button type="submit" class="update-member-button">
                            <i class="fas fa-save"></i> Save Changes
                        </button>
                    </div>
                </form>
            </div>

        </section>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        
        const firebaseConfig = {
            apiKey: "AIzaSyDByxtekgi1CRBs0FWpSstrIWMlDbv1CHA",
            authDomain: "responsive-app-df28f.firebaseapp.com",
            projectId: "responsive-app-df28f",
            storageBucket: "responsive-app-df28f.firebasestorage.app",
            messagingSenderId: "242703032257",
            appId: "1:242703032257:web:cf20ab70b92fa3609e5940",
            measurementId: "G-MK0XLZ808S"
        };
        
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const urlParams = new URLSearchParams(window.location.search);
        const memberId = urlParams.get('id');

        if (!memberId) {
            alert('Error: No member ID provided for editing.');
            window.location.href = 'members.html';
        }
        
        let qrcodeInstance = null;
        let memberEmail = null;
        
        const generateQRCode = (qrData, docId, fullName) => {
            if (qrcodeInstance) {
                qrcodeInstance.clear();
            }
            
            document.querySelector('.member-id-display').textContent = `ID: ${docId.substring(0, 8)}`;

            qrcodeInstance = new QRCode(document.getElementById("qrcode"), {
                text: qrData,
                width: 150,
                height: 150,
                colorDark : "#000000",
                colorLight : "#ffffff",
                correctLevel : QRCode.CorrectLevel.H
            });
            
            document.getElementById('download-qr-button').disabled = false;
            
            document.getElementById('download-qr-button').onclick = () => {
                setTimeout(() => {
                    const canvas = document.getElementById('qrcode').querySelector('canvas');
                    if (canvas) {
                        const dataURL = canvas.toDataURL("image/png");
                        const a = document.createElement('a');
                        a.href = dataURL;
                        const safeName = (fullName || 'Member').replace(/[^a-z0-9]/gi, '_');
                        a.download = `${safeName}_ID_${docId.substring(0, 8)}_QR.png`;
                        
                        document.body.appendChild(a);
                        a.click();
                        document.body.removeChild(a);
                        
                        alert('QR Code download started!');
                    } else {
                        alert('Error: Could not find QR code image data.');
                    }
                }, 100); 
            };
        };

      
        const fetchMemberData = async (id) => {
            try {
                const memberDocRef = doc(db, 'users', id);
                const memberDoc = await getDoc(memberDocRef);

                if (memberDoc.exists()) {
                    const data = memberDoc.data();
                    memberEmail = data.email; 

                    document.getElementById('member-doc-id').value = id;
                    document.getElementById('member-full-name').value = data.fullName || '';
                    document.getElementById('member-email').value = data.email || '';
                    document.getElementById('member-org-id').value = data.organizationId || 'N/A'; 
                    document.getElementById('member-role').value = data.role || 'member';
                    document.getElementById('member-status').value = data.status || 'pending';
                    document.getElementById('page-title').textContent = `Edit Profile for ${data.fullName || data.email}`;
                    
            
                    generateQRCode(id, id, data.fullName);

                } else {
                    alert('Error: Member not found.');
                    window.location.href = 'members.html';
                }
            } catch (error) {
                console.error("Error fetching member data:", error);
                alert('Failed to load member data: ' + error.message);
                window.location.href = 'members.html';
            }
        };

     
        document.getElementById('reset-password-button').addEventListener('click', async () => {
            if (!memberEmail) {
                alert("Cannot send reset link. Member email is not available.");
                return;
            }
            
            if (!confirm(`Are you sure you want to send a password reset link to ${memberEmail}?`)) {
                return;
            }

            try {
                await sendPasswordResetEmail(auth, memberEmail);
                alert(`Password reset link sent to ${memberEmail}.`);
            } catch (error) {
                console.error("Password Reset Error:", error.message);
                alert(`Failed to send password reset: ${error.message}`);
            }
        });


        document.querySelector('.edit-member-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const docId = document.getElementById('member-doc-id').value;
            const fullName = document.getElementById('member-full-name').value;
            const role = document.getElementById('member-role').value;
            const status = document.getElementById('member-status').value;

            const updates = {
                fullName: fullName,
                role: role,
                status: status,
                updatedAt: new Date()
            };

            try {
                const memberDocRef = doc(db, 'users', docId);
                await updateDoc(memberDocRef, updates);

                alert(`${fullName}'s profile updated successfully!`);
                window.location.href = 'members.html';

            } catch (error) {
                console.error('Update Member Error:', error.message);
                alert('Failed to update member profile: ' + error.message);
            }
        });

   
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                const userDocRef = doc(db, 'users', user.uid);
                const userDoc = await getDoc(userDocRef);
                
                if (userDoc.exists()) {
                    const userData = userDoc.data();
                    const fullName = userData.fullName || user.email.split('@')[0];
                    const firstName = fullName.split(' ')[0] || 'Admin';
                    
                    document.getElementById('user-short-name').textContent = firstName;
                    
                    fetchMemberData(memberId);
                } else {
                     window.location.href = 'login.html';
                }
            } else {
                window.location.href = 'login.html';
            }
        });

        document.getElementById('logout-button').addEventListener('click', async (e) => {
            e.preventDefault();
            try {
                await signOut(auth);
            } catch (error) {
                console.error("Logout error:", error.message);
                alert('Logout failed: ' + error.message);
            }
        });
    </script>
</body>
</html>
